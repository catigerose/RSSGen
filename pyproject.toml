[project]
name = "rssgen"
version = "0.1.0"
description = "抓取新闻网站并生成 RSS/Atom 种子的 Python 项目"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "feedgen>=1.0.0",
    "feedparser>=6.0.12",
    "lxml>=6.0.2",
    "pytz>=2026.1.post1",
    "requests>=2.32.5",
    "selenium>=4.41.0",
]

[project.scripts]
rssgen = "main:main"
